<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exerc 03</title>
</head>
<body>
    <script>
        let numero = prompt("Digite um número inteiro.");
        let fatorial = 1;
        for(let i = 1; i <= numero; i++){
            fatorial = fatorial * i;

        }
        alert(fatorial);
    </script>
</body>
