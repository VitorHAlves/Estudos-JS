<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diário de Bordo — Lista de Tarefas</title>

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="ocean-bg"></div>

  <main class="container">
    <div class="logbook mx-auto">


      <header class="logbook-header text-center">
        <span class="eyebrow">Capitão, registre suas missões</span>
        <h1 class="logbook-title">Diário de Bordo</h1>
        <p class="logbook-subtitle">Cada tarefa cumprida é uma ilha a menos até o tesouro.</p>
      </header>

     
      <form id="form-tarefa" class="add-row" autocomplete="off">
        <input
          type="text"
          id="input-tarefa"
          class="form-control task-input"
          placeholder="Escreva uma nova missão..."
          maxlength="120"
          required
        >
        <button type="submit" class="btn btn-selar" title="Adicionar tarefa">
          <span class="selo">✒</span> Registrar
        </button>
      </form>

    
      <div class="tally d-flex justify-content-between align-items-center">
        <span id="contagem-texto">Nenhuma missão registrada ainda.</span>
      </div>

      
      <ul id="lista-tarefas" class="task-list list-unstyled"></ul>

      
      <div id="estado-vazio" class="empty-state text-center">
        <div class="empty-icon">⚓</div>
        <p>O mar está calmo. Registre sua primeira missão acima.</p>
      </div>

    </div>

    <p class="sign-off text-center"> que os ventos guiem suas tarefas até o fim </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
